
version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  file:
    class: logging.FileHandler
    filename: app.log
    encoding: utf-8
    level: INFO
    formatter: detailed

root:
  level: INFO
  handlers:
    - file
