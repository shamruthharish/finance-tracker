
{% extends "base.html" %}

{% block title %}Import Transactions{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Import Transactions</h2>

    <p>Upload your transaction CSV file.</p>

    {% if errors %}
        <div class="alert alert-danger">
            <strong>Import errors:</strong>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <div class="card p-4 mt-3">

        <form method="POST"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label">
                    Select CSV File
                </label>

                <input type="file"
                       name="file"
                       class="form-control"
                       accept=".csv"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary">
                Upload and Preview
            </button>

        </form>

    </div>

    <div class="mt-3">
        <a href="{{ url_for('transactions.list_transactions') }}">
            Back to Transactions
        </a>
    </div>

</div>

{% endblock %}
