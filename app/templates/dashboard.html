
{% extends "base.html" %}

{% block title %}Dashboard | Finance Tracker{% endblock %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">Financial Dashboard</h2>

    <p class="text-muted">
        Overview of your spending and monthly expenses.
    </p>

    <div class="row g-4">

        <!-- Category Spending Doughnut Chart -->
        <div class="col-12 col-lg-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title mb-4">
                        Spending by Category
                    </h5>

                    <div style="height: 320px; position: relative;">

                        <canvas id="categoryChart"></canvas>

                    </div>

                </div>

            </div>

        </div>


        <!-- Monthly Spending Bar Chart -->
        <div class="col-12 col-lg-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title mb-4">
                        Monthly Spending Trend
                    </h5>

                    <div style="height: 320px; position: relative;">

                        <canvas id="monthlyChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

    // Receive Python data through Jinja2 JSON

    const categoryLabels =
        {{ category_labels | tojson }};

    const categoryAmounts =
        {{ category_amounts | tojson }};

    const monthlyLabels =
        {{ monthly_labels | tojson }};

    const monthlyAmounts =
        {{ monthly_amounts | tojson }};


    // 1. Doughnut Chart - Spending by Category

    const categoryCanvas =
        document.getElementById("categoryChart");

    new Chart(categoryCanvas, {

        type: "doughnut",

        data: {

            labels: categoryLabels,

            datasets: [{

                label: "Expenses",

                data: categoryAmounts,

                backgroundColor: [
                    "#4e79a7",
                    "#f28e2b",
                    "#e15759",
                    "#76b7b2",
                    "#59a14f",
                    "#edc949",
                    "#af7aa1",
                    "#ff9da7"
                ],

                borderWidth: 2

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {
                    position: "bottom"
                }

            }

        }

    });


    // 2. Bar Chart - Monthly Spending Trend

    const monthlyCanvas =
        document.getElementById("monthlyChart");

    new Chart(monthlyCanvas, {

        type: "bar",

        data: {

            labels: monthlyLabels,

            datasets: [{

                label: "Monthly Expenses (₹)",

                data: monthlyAmounts,

                backgroundColor: "#4e79a7",

                borderRadius: 6

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                y: {

                    beginAtZero: true,

                    title: {
                        display: true,
                        text: "Amount (₹)"
                    }

                },

                x: {

                    title: {
                        display: true,
                        text: "Month"
                    }

                }

            }

        }

    });

</script>

{% endblock %}
